# 基准语言 = 英文（English base catalog）。
# 所有其他语言（如 active.zh.toml）必须包含与此文件完全相同的 key 集合。
# 命名规范：{领域前缀}_{描述}，前缀含义见 GOLANG_CLI_I18N_GUIDE.md 第 5 节。
# 格式化占位符（%s/%d/%q/%w）在各语言中必须保持一致的数量与类型。

# ===== 根命令描述 =====
CMD_al_Short = "Cross-shell alias manager"
CMD_al_Long = """
al reads aliases from ~/.config/al/alias.toml and exports them
for the target shell.

Supported shells: bash, zsh, fish, powershell
"""

# ===== 各子命令描述（Short / Long）=====
CMD_add_Short = "Add or update an alias"
CMD_add_Long = """
Add a new alias or update an existing one.

The command is stored in ~/.config/al/alias.toml.

Examples:
  al add gs "git status"              # shared across all shells
  al add rmrf "rm -rf" --zsh          # zsh only
  al add rmrf "Remove-Item -Recurse -Force" --powershell  # PowerShell only
  al add o "open ." --zsh --bash      # zsh and bash only
"""

CMD_edit_Short = "Modify an existing alias"
CMD_edit_Long = """
Modify an existing alias's command and/or shell scope.

Shell flags set the new scope (not additive). Omit them to keep the current scope.

Examples:
  al edit cdf 'cd ~' --fish                    # fish only, new command
  al edit cdf --fish                            # fish only, keep command
  al edit cdf --common                          # shared across all shells
  al edit cdf 'cd ~'                            # change command, keep current shells
"""

CMD_init_Short = "Generate alias declarations for a shell"
CMD_init_Long = """
Output alias declarations for the given shell.

Supported shells: bash, zsh, fish, powershell

Usage:
  eval "$(al init zsh)"     # zsh
  eval "$(al init bash)"    # bash
  al init fish | source     # fish
  Invoke-Expression (&al init powershell | Out-String)  # PowerShell
"""

CMD_ls_Short = "List all aliases"
CMD_ls_Long = """
List all aliases with their commands and applicable shells.

Optional filter argument filters by alias name or command value.
"""

CMD_rm_Short = "Remove an alias"
CMD_rm_Long = "Remove an alias from the configuration file."

CMD_show_Short = "Show details of a specific alias"
CMD_show_Long = "Display detailed information about a single alias definition."

CMD_version_Short = "Show version information"

