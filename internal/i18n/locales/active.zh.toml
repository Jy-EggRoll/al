CMD_completion_bash_Short = "为 bash 生成自动补全脚本"
CMD_completion_bash_Long = "为 bash shell 生成自动补全脚本。\n\n该脚本依赖 'bash-completion' 软件包。\n若尚未安装，可通过操作系统的包管理器安装。\n\n在当前 shell 会话中加载补全：\n\n  source <(al completion bash)\n\n若要在每次新会话中加载，执行以上命令一次即可。"
CMD_completion_zsh_Short = "为 zsh 生成自动补全脚本"
CMD_completion_zsh_Long = "为 zsh shell 生成自动补全脚本。\n\n若当前环境尚未启用 shell 补全，需先启用。\n执行以下命令一次：\n\n  echo 'autoload -Uz compinit; compinit' >> ~/.zshrc\n\n在当前 shell 会话中加载补全：\n\n  source <(al completion zsh)\n\n若要在每次新会话中加载，执行以上命令一次即可。"
CMD_completion_fish_Short = "为 fish 生成自动补全脚本"
CMD_completion_fish_Long = "为 fish shell 生成自动补全脚本。\n\n在当前 shell 会话中加载补全：\n\n  al completion fish | source\n\n若要在每次新会话中加载，执行以上命令一次即可。"
CMD_completion_powershell_Short = "为 powershell 生成自动补全脚本"
CMD_completion_powershell_Long = "为 powershell shell 生成自动补全脚本。\n\n在当前 shell 会话中加载补全：\n\n  al completion powershell | Out-String | Invoke-Expression\n\n若要在每次新会话中加载，执行以上命令一次即可。"
