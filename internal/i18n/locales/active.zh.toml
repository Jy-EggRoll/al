# ===== 根命令描述 =====
CMD_al_Short = "跨 Shell 别名管理器"
CMD_al_Long = """
al 从 ~/.config/al/alias.toml 读取别名，并为目标 shell 导出。

支持的 shell：bash、zsh、fish、powershell
"""

# ===== 各子命令描述（Short / Long）=====
CMD_add_Short = "新增或更新一个别名"
CMD_add_Long = """
新增别名，或更新已有的别名。

命令会保存在 ~/.config/al/alias.toml。

示例：
  al add gs "git status"              # 所有 shell 共享
  al add rmrf "rm -rf" --zsh          # 仅 zsh
  al add rmrf "Remove-Item -Recurse -Force" --powershell  # 仅 PowerShell
  al add o "open ." --zsh --bash      # 仅 zsh 与 bash
"""

CMD_edit_Short = "修改已有的别名"
CMD_edit_Long = """
修改已有别名的命令和/或所属 shell 范围。

shell 参数设置新的范围（非叠加）。省略它们则保持当前范围。

示例：
  al edit cdf 'cd ~' --fish                    # 仅 fish，新命令
  al edit cdf --fish                            # 仅 fish，保持命令
  al edit cdf --common                          # 所有 shell 共享
  al edit cdf 'cd ~'                            # 改命令，保持当前 shell
"""

CMD_init_Short = "为指定 shell 生成别名声明"
CMD_init_Long = """
为给定 shell 输出别名声明。

支持的 shell：bash、zsh、fish、powershell

用法：
  eval "$(al init zsh)"     # zsh
  eval "$(al init bash)"    # bash
  al init fish | source     # fish
  Invoke-Expression (&al init powershell | Out-String)  # PowerShell
"""

CMD_ls_Short = "列出所有别名"
CMD_ls_Long = """
列出所有别名及其命令与适用的 shell。

可选的过滤参数按别名名或命令内容过滤。
"""

CMD_rm_Short = "删除一个别名"
CMD_rm_Long = "从配置文件中删除一个别名。"

CMD_show_Short = "查看某个别名的详细信息"
CMD_show_Long = "展示单个别名定义的详细信息。"

CMD_version_Short = "显示版本信息"

